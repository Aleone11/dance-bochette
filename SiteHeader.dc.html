<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:rgba(246,241,234,0.95);backdrop-filter:blur(8px);border-bottom:1px solid #e3d9cd;font-family:'Hanken Grotesk',sans-serif">
<div style="max-width:1320px;margin:0 auto;padding:18px clamp(20px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
<a href="index.html" aria-label="Dance Bochette home" style="display:flex;align-items:center;gap:16px;line-height:1;color:#231a1c;text-decoration:none">
<img src="assets/bochette-mark-abstract2.svg" alt="" style="height:clamp(104px,11vw,140px);width:auto;display:block;margin-right:-4px">
<img src="assets/bochette-wordmark.png" alt="Dance Bochette — Excellence in Dance since 1951" style="height:clamp(58px,6vw,78px);width:auto;display:block;align-self:flex-end;margin-bottom:4px">
</a>
<nav style="display:flex;align-items:center;gap:clamp(14px,2vw,28px);font-size:14px;flex-wrap:wrap;justify-content:flex-end">
<sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
<sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><a href="{{ l.href }}" style="color:#5c1525;text-decoration:none;border-bottom:1px solid #5c1525;padding-bottom:3px">{{ l.label }}</a></sc-if>
<sc-if value="{{ l.inactive }}" hint-placeholder-val="{{ true }}"><a href="{{ l.href }}" style="color:#231a1c;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:3px" style-hover="color:#5c1525">{{ l.label }}</a></sc-if>
</sc-for>
<a href="https://app.gostudiopro.com/online/dancebochette" style="color:#4a3d3e;text-decoration:none">Parent Portal</a>
<a href="https://app.gostudiopro.com/online/dancebochette" style="background:#231a1c;color:#f6f1ea;padding:11px 22px;border-radius:999px;font-weight:500;text-decoration:none" style-hover="background:#5c1525;color:#f6f1ea">Register</a>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;classes&quot;,&quot;performances&quot;,&quot;instructors&quot;,&quot;gallery&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const links = [
      ['about', 'About', 'about.html'],
      ['classes', 'Classes', 'classes.html'],
      ['performances', 'Performances', 'performances.html'],
      ['instructors', 'Instructors', 'instructors.html'],
      ['gallery', 'Gallery', 'gallery.html'],
      ['contact', 'Contact', 'contact.html']
    ].map(([k, label, href]) => ({ label, href, active: k === a, inactive: k !== a }));
    return { links };
  }
}
</script>
</body>
</html>
